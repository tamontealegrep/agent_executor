[pytest]
# family_aims/tests/... and novafem_surrogacy/tests/... both have test files
# with the same basename (test_email_templates.py, test_timezones.py) and no
# __init__.py to disambiguate them -- pytest's legacy "prepend" import mode
# then collides their module names when the whole src/ tree is collected in
# one run (found running the full suite for the first time, 2026-09-28;
# previously only ever run scoped to one subfolder at a time, which never
# hit the collision). importlib mode keys each test file's module identity
# by its own file path instead, so same-basename files never collide.
addopts = --import-mode=importlib
