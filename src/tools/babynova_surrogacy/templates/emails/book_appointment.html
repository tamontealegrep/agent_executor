<div style="font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 20px; background-color: #f5f5f5;">
  <div style="background-color: #ffffff; border-radius: 10px; padding: 28px; border-left: 5px solid #7c3aed;">
    <h2 style="margin: 0 0 6px 0; color: #1f2937;">🗓️ Nueva cita programada</h2>
    <p style="color: #6b7280; margin: 0 0 24px 0; font-size: 14px;">Un paciente acaba de programar una cita con SOFIA.</p>
    <table style="width: 100%; border-collapse: collapse;">
      <tr>
        <td style="padding: 10px 0; color: #6b7280; font-size: 13px; width: 120px;">👤 Paciente</td>
        <td style="padding: 10px 0; color: #111827; font-weight: bold; font-size: 15px; text-transform: capitalize;">${contact_name}</td>
      </tr>
      <tr style="border-top: 1px solid #f3f4f6;">
        <td style="padding: 10px 0; color: #6b7280; font-size: 13px;">📅 Fecha</td>
        <td style="padding: 10px 0; color: #111827; font-weight: bold; font-size: 15px;">${booking_date}</td>
      </tr>
      <tr style="border-top: 1px solid #f3f4f6;">
        <td style="padding: 10px 0; color: #6b7280; font-size: 13px;">📱 Teléfono</td>
        <td style="padding: 10px 0; color: #111827; font-weight: bold; font-size: 15px;">${contact_phone}</td>
      </tr>
    </table>
    <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 20px 0;">
    <p style="color: #9ca3af; font-size: 12px; margin: 0;">Notificación automática · SOFIA · Babynova</p>
  </div>
</div>
